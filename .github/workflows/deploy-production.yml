name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bioscope-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: image_meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/${OWNER_LC}/bioscope/backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${OWNER_LC}/bioscope/frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.backend_image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.frontend_image }}

      - name: Configure SSH
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          mkdir -p ~/.ssh
            printf '%s\n' "$DO_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
            ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_PORT: ${{ secrets.DO_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          APP_PORT: ${{ secrets.APP_PORT }}
          BACKEND_IMAGE: ${{ steps.image_meta.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.image_meta.outputs.frontend_image }}
        run: |
          PORT="${DO_PORT:-22}"
          RELEASE_ID="${GITHUB_SHA::12}"
          REMOTE_DIR="/tmp/bioscope-deploy-${RELEASE_ID}"

          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -p ${PORT}" \
            scripts/deploy_docker_remote.sh "${DO_USER}@${DO_HOST}:${REMOTE_DIR}/deploy_docker_remote.sh"

          ssh -i ~/.ssh/id_ed25519 -p "$PORT" "${DO_USER}@${DO_HOST}" \
            "chmod +x ${REMOTE_DIR}/deploy_docker_remote.sh"

          ssh -i ~/.ssh/id_ed25519 -p "$PORT" "${DO_USER}@${DO_HOST}" \
            "GHCR_USERNAME='${GHCR_USERNAME}' \
             GHCR_TOKEN='${GHCR_TOKEN}' \
             SUPABASE_URL='${SUPABASE_URL}' \
             SUPABASE_ANON_KEY='${SUPABASE_ANON_KEY}' \
             SUPABASE_SERVICE_KEY='${SUPABASE_SERVICE_KEY}' \
             FRONTEND_URL='${FRONTEND_URL}' \
             APP_PORT='${APP_PORT:-5000}' \
             bash ${REMOTE_DIR}/deploy_docker_remote.sh \
               '${RELEASE_ID}' \
               '${BACKEND_IMAGE}' \
               '${FRONTEND_IMAGE}' && \
             rm -rf ${REMOTE_DIR}"
